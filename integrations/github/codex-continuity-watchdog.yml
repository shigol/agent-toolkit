name: Codex continuity watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: codex-continuity-controller
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
            codex
            tools
      - uses: actions/github-script@v7
        with:
          script: |
            const {controller} = require('./.github/scripts/codex_continuity.cjs');
            await controller({github, context});
