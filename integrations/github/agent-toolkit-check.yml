name: Shared toolkit checks
on:
  pull_request:
    paths:
      - .agent-toolkit
      - .agent-toolkit.json
      - .agent-handoff.json
      - .agent-skill-cache/**
      - .agents/skills/**
      - .claude/skills/**
      - .gitmodules
      - .github/dependabot.yml
      - .github/scripts/*toolkit*
      - .github/scripts/claude_*
      - .github/workflows/claude-wake.yml
      - .github/scripts/*skill_probe*
      - .github/workflows/codex-build.yml
      - .github/workflows/codex-task.yml
      - .github/workflows/codex-recover.yml
      - .github/scripts/codex_recover.cjs
      - .github/scripts/codex_task_patch.py
      - .github/scripts/codex_request.cjs
      - .github/scripts/codex_request.test.cjs
      - .github/scripts/codex_continuity.cjs
      - .github/scripts/codex_continuity.test.cjs
      - .github/scripts/codex_result.cjs
      - .github/scripts/codex_task_run.py
      - .github/workflows/codex-request.yml
      - .github/workflows/codex-continuity.yml
      - .github/workflows/codex-continuity-watchdog.yml
      - .github/workflows/agent-toolkit-*.yml
      - scripts/setup-agent-toolkit.sh
      - tools/setup-agent-toolkit.sh
  push:
    paths:
      - .agent-toolkit
      - .agent-toolkit.json
      - .agent-handoff.json
      - .agent-skill-cache/**
      - .agents/skills/**
      - .claude/skills/**
      - .gitmodules
      - .github/dependabot.yml
      - .github/scripts/*toolkit*
      - .github/scripts/claude_*
      - .github/workflows/claude-wake.yml
      - .github/scripts/*skill_probe*
      - .github/workflows/codex-build.yml
      - .github/workflows/codex-task.yml
      - .github/workflows/codex-recover.yml
      - .github/scripts/codex_recover.cjs
      - .github/scripts/codex_task_patch.py
      - .github/scripts/codex_request.cjs
      - .github/scripts/codex_request.test.cjs
      - .github/scripts/codex_continuity.cjs
      - .github/scripts/codex_continuity.test.cjs
      - .github/scripts/codex_result.cjs
      - .github/scripts/codex_task_run.py
      - .github/workflows/codex-request.yml
      - .github/workflows/codex-continuity.yml
      - .github/workflows/codex-continuity-watchdog.yml
      - .github/workflows/agent-toolkit-*.yml
      - scripts/setup-agent-toolkit.sh
      - tools/setup-agent-toolkit.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installation:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .agent-toolkit
            .agents
            .claude
            .agent-skill-cache
            .github/scripts
            .github/workflows
            scripts
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the exact public toolkit version
        run: git submodule update --init -- .agent-toolkit
      - name: Validate inventory and every source checksum before execution
        run: python3 .github/scripts/toolkit_update.py validate
      - name: Reject stale or unpublished readable cache before setup
        run: python3 .agent-toolkit/scripts/toolkit.py verify-cache --project . --check
      - name: Verify installed Claude wake bridge
        run: |
          components=(.github/scripts/claude_wake.cjs .github/scripts/claude_wake.test.cjs .github/workflows/claude-wake.yml)
          present=0
          for component in "${components[@]}"; do
            if [ -e "$component" ] || [ -L "$component" ]; then present=1; fi
          done
          if [ "$present" = 1 ]; then
            for component in "${components[@]}"; do
              test -f "$component" && test ! -L "$component" || { echo '::error::Incomplete or redirected Claude wake integration'; exit 1; }
              pinned=".agent-toolkit/integrations/github/${component##*/}"
              test -f "$pinned" && test ! -L "$pinned" && cmp -s "$component" "$pinned" || { echo '::error::Managed Claude wake files differ from the reviewed toolkit pin'; exit 1; }
            done
            node .github/scripts/claude_wake.test.cjs
          fi
          if [ -f .agent-toolkit/HANDOFF.json ] || [ -e .agent-handoff.json ] || [ -L .agent-handoff.json ]; then
            python3 .agent-toolkit/scripts/toolkit.py handoff-config --project .
          fi
      - name: Verify managed collaboration helpers before executing them
        run: |
          for name in codex_request.cjs codex_request.test.cjs codex_continuity.cjs codex_continuity.test.cjs codex_task_run.py codex_task_patch.py codex_result.cjs codex_recover.cjs; do
            installed=".github/scripts/$name"
            pinned=".agent-toolkit/integrations/github/$name"
            test -f "$installed" && test ! -L "$installed" && test -f "$pinned" && cmp -s "$installed" "$pinned" || { echo '::error::Managed collaboration helper differs from the reviewed pin'; exit 1; }
          done
          node .github/scripts/codex_request.test.cjs
          node .github/scripts/codex_continuity.test.cjs
      - name: Check whether a bot update can merge unattended
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          old=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent-toolkit?ref=$BASE_SHA" --jq .sha)
          git -C .agent-toolkit fetch origin "$old"
          # Review-required is not an installation failure. The trusted default-branch
          # merge job independently compares upstream files and refuses source/code/manifest updates.
          python3 .github/scripts/toolkit_update.py policy --base "$old"
      - name: Verify fresh installation, repeat installation, and runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ -f scripts/setup-agent-toolkit.sh ]; then
            sh scripts/setup-agent-toolkit.sh
            sh scripts/setup-agent-toolkit.sh
          else
            bash tools/setup-agent-toolkit.sh
            bash tools/setup-agent-toolkit.sh
          fi
      - name: Require committed Claude routes to match the pin
        run: |
          python3 .agent-toolkit/scripts/toolkit.py emit-routes --project . --agents claude --check
          git diff --exit-code -- CLAUDE.md .agents/skills .claude/skills .agent-skill-cache
          python3 .agent-toolkit/scripts/toolkit.py verify-cache --project . --check
      - name: Report selected files for both agents
        run: python3 .agent-toolkit/scripts/toolkit.py status --project .
      - name: Test installer, propagation of new skills, and merge guards
        run: |
          python3 -m unittest discover -s .agent-toolkit/tests -v
          node --test .agent-toolkit/tests/browser-discovery.test.mjs
          python3 -m unittest discover -s .github/scripts -p 'test_toolkit*.py' -v
          node --test .github/scripts/merge_toolkit.test.cjs
