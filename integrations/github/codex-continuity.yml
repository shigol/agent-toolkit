name: Codex continuity
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Codex committed brief, Codex build]
    types: [completed]
  workflow_dispatch:
    inputs:
      completed_run:
        description: Optional same-repository worker whose actual completion must be observed
        default: ''
      brief:
        description: Optional committed Markdown brief for a monitored single task
        default: ''
      request_issue:
        description: Required issue/PR number when registering a brief
        default: ''
      request_id:
        description: Required stable numeric request ID; reuse it after an uncertain response
        default: ''
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('codex-continuity-intake-{0}', github.event.comment.id) || inputs.brief != '' && format('codex-continuity-intake-{0}', inputs.request_id) || 'codex-continuity-controller' }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/codex-plan ') ||
      startsWith(github.event.comment.body, '/codex-pause ') ||
      startsWith(github.event.comment.body, '/codex-resume ') ||
      startsWith(github.event.comment.body, '/codex-accept ') ||
      startsWith(github.event.comment.body, '/codex-archive ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
            codex
            tools
      - uses: actions/github-script@v7
        with:
          script: |
            const {controller, waitForPredecessor} = require('./.github/scripts/codex_continuity.cjs');
            await waitForPredecessor({github, repo: context.repo, value: context.payload.inputs?.completed_run || '',
              branch: context.payload.repository.default_branch});
            await controller({github, context});
