name: Codex brief request
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
jobs:
  request:
    if: startsWith(github.event.comment.body, '/codex-run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
            codex
            tools
      - uses: actions/github-script@v7
        with:
          script: |
            const {dispatch} = require('./.github/scripts/codex_request.cjs');
            await dispatch({github, context});
