name: Claude wake request
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
concurrency:
  group: claude-wake-intake-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  request:
    if: startsWith(github.event.comment.body, '/claude-wake ') || startsWith(github.event.comment.body, '/claude-wake-close ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
        with:
          script: |
            const {wake} = require('./.github/scripts/claude_wake.cjs');
            await wake({github, context});
