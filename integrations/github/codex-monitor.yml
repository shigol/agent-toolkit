name: Codex bounded cloud monitor
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: codex-continuity-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
            codex
            tools
      - name: Reconcile until idle or bounded handoff
        uses: actions/github-script@v7
        with:
          script: |
            const {monitor} = require('./.github/scripts/codex_monitor.cjs');
            await monitor({github, context});
