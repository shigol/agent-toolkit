name: Merge checked toolkit updates
on:
  workflow_run:
    workflows: [Shared toolkit checks]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      # workflow_run uses trusted default-branch code, never the triggering PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const {run} = require('./.github/scripts/merge_toolkit.cjs');
            await run({github, context, core});
