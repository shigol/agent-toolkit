version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
      time: '06:30'
      timezone: Etc/UTC
    allow:
      - dependency-name: .agent-toolkit
    cooldown:
      exclude: [".agent-toolkit"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(toolkit)'
