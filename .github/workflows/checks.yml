name: Toolkit checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source integrity and selection behavior
        run: |
          python3 scripts/toolkit.py verify-sources
          python3 scripts/skills.py check
          python3 -m unittest discover -s tests -v
          node --test tests/browser-discovery.test.mjs
      - name: Verify the existing design runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 scripts/toolkit.py setup-runtime
          python3 scripts/toolkit.py verify-runtime
